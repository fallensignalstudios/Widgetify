name: Figma plugin

on:
  push:
    branches: [main]
    paths:
      - 'figma-plugin/**'
      - 'schema/**'
      - 'samples/**'
      - '.github/workflows/figma-plugin.yml'
  pull_request:
    paths:
      - 'figma-plugin/**'
      - 'schema/**'
      - 'samples/**'
      - '.github/workflows/figma-plugin.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: figma-plugin
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: figma-plugin/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - run: npm ci

      # Typecheck, unit tests (which also regenerate samples/), esbuild.
      - run: npm run check

      - name: Committed dist/ matches the sources
        run: git diff --exit-code -- dist

      - name: Sample bundle matches schema/figmasync.schema.json
        working-directory: .
        run: |
          python -m pip install --quiet jsonschema
          python - <<'EOF'
          import json
          import jsonschema

          schema = json.load(open('schema/figmasync.schema.json'))
          jsonschema.Draft202012Validator.check_schema(schema)
          document = json.load(open('samples/MainMenu/figmasync.json'))
          jsonschema.Draft202012Validator(schema).validate(document)
          print('samples/MainMenu/figmasync.json is valid')
          EOF
