<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      :root {
        --bg: var(--figma-color-bg, #ffffff);
        --bg-2: var(--figma-color-bg-secondary, #f5f5f5);
        --text: var(--figma-color-text, #1e1e1e);
        --text-2: var(--figma-color-text-secondary, #6b6b6b);
        --border: var(--figma-color-border, #e6e6e6);
        --brand: var(--figma-color-bg-brand, #0d99ff);
        --brand-text: var(--figma-color-text-onbrand, #ffffff);
        --warn: var(--figma-color-text-warning, #b86200);
        --danger: var(--figma-color-text-danger, #dc3412);
        --ok: var(--figma-color-text-success, #14ae5c);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font: 12px/1.45 Inter, system-ui, -apple-system, 'Segoe UI', sans-serif;
        color: var(--text);
        background: var(--bg);
      }
      .app { display: flex; flex-direction: column; gap: 12px; padding: 14px; height: 100vh; }
      header { display: flex; align-items: baseline; gap: 8px; }
      header .title { font-size: 14px; font-weight: 700; }
      header .subtitle { color: var(--text-2); }
      .card { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; background: var(--bg-2); }
      .sel-name { font-weight: 600; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .sel-name.muted { font-weight: 400; color: var(--text-2); }
      .sel-meta { color: var(--text-2); margin-top: 2px; }
      .options { display: flex; flex-direction: column; gap: 8px; }
      .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
      .check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
      select, input[type='text'] {
        font: inherit; color: var(--text); background: var(--bg);
        border: 1px solid var(--border); border-radius: 5px; padding: 4px 6px;
      }
      input[type='text'] { width: 100%; }
      .stack { display: flex; flex-direction: column; gap: 4px; }
      .hint { color: var(--text-2); font-size: 11px; }
      button {
        font: inherit; font-weight: 600; border-radius: 6px; padding: 8px 12px; cursor: pointer;
        border: 1px solid var(--border); background: var(--bg); color: var(--text);
      }
      button.primary { background: var(--brand); color: var(--brand-text); border-color: transparent; }
      button:disabled { opacity: 0.45; cursor: default; }
      .actions { display: flex; flex-direction: column; gap: 8px; }
      .live { display: flex; align-items: center; gap: 8px; }
      .live .status { flex: 1; color: var(--text-2); font-size: 11px; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-2); opacity: 0.5; flex: none; }
      .dot.on { background: var(--ok); opacity: 1; }
      .progress .track { height: 4px; border-radius: 2px; background: var(--border); overflow: hidden; }
      .progress .fill { height: 100%; width: 0; background: var(--brand); transition: width 120ms linear; }
      .progress .label { color: var(--text-2); font-size: 11px; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .log { flex: 1; min-height: 60px; overflow: auto; border-top: 1px solid var(--border); padding-top: 8px; }
      .line { padding: 2px 0; word-break: break-word; }
      .line.warn { color: var(--warn); }
      .line.error { color: var(--danger); }
      .line.ok { color: var(--ok); }
      footer { color: var(--text-2); font-size: 11px; }
      code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 10.5px; }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <span class="title">Widgetify</span>
        <span class="subtitle">Figma → Unreal UMG</span>
      </header>

      <div class="card">
        <div class="sel-name muted" id="selName">Loading…</div>
        <div class="sel-meta" id="selMeta"></div>
      </div>

      <div class="options">
        <div class="row">
          <span>Image scale</span>
          <select id="scale">
            <option value="1">1x</option>
            <option value="2">2x (recommended)</option>
            <option value="3">3x</option>
            <option value="4">4x</option>
          </select>
        </div>
        <label class="check"><input type="checkbox" id="includeHidden" /> Export hidden layers (collapsed in Unreal)</label>
        <label class="check"><input type="checkbox" id="rasterize" /> Rasterize gradients, shadows, masks</label>
        <div class="stack">
          <span>Button component prefixes</span>
          <input type="text" id="prefixes" placeholder="Btn/, Button/" />
          <span class="hint">Component sets with these prefixes export every variant, so Unreal can build hover/pressed/disabled styles.</span>
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="download" disabled>Export bundle (.zip)</button>
        <div class="live">
          <span class="dot" id="liveDot"></span>
          <span class="status" id="liveStatus">Looking for Unreal…</span>
          <button id="push" disabled>Push to Unreal</button>
        </div>
      </div>

      <div class="progress" id="progress" hidden>
        <div class="track"><div class="fill" id="bar"></div></div>
        <div class="label" id="progressLabel"></div>
      </div>

      <div class="log" id="log"></div>

      <footer>Layer tags: <code>[img]</code> <code>[skip]</code> <code>[focus]</code> <code>[action=Back]</code> · names like <code>Btn_Play</code>, <code>Txt_Title</code></footer>
    </div>
